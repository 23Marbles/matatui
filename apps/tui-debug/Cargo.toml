[package]
name = "tui-debug"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.35"
matatree-tui = { path = "../../crates/matatree-tui" }
matatree = { path = "../../crates/matatree", features = ["serde"] }
ratatui = "0.30.2"
clap = { version = "4.6.9", features = ["derive"] }
env_logger = "0.11.12"
anyhow = "1.0.105"
ron = "0.12.3"
debug = { path = "../debug", optional = true }
parking_lot = { version = "0.13.0", optional = true }
eframe = { version = "0.37.0", optional = true }

[features]
default = ["gui"]
gui = ["dep:debug", "dep:eframe", "dep:parking_lot"]
